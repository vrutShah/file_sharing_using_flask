<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FileShare — Drop & Share</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box}

:root{
--bg:#04050a;
--surface:#0d0f1a;
--border:#1c2035;
--accent:#4f8eff;
--accent2:#00e5c0;
--text:#dde3f5;
--muted:#5a6380;
--danger:#ff4f6e;
--radius:14px;
}

body{
font-family:'Syne',sans-serif;
background:var(--bg);
color:var(--text);
min-height:100vh;
overflow-x:hidden;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:3rem 1rem;
}

/* background grid */

body::before{
content:"";
position:fixed;
inset:0;
background-image:
linear-gradient(rgba(79,142,255,.04) 1px,transparent 1px),
linear-gradient(90deg,rgba(79,142,255,.04) 1px,transparent 1px);
background-size:48px 48px;
}

/* glow orbs */

.orb{
position:fixed;
border-radius:50%;
filter:blur(120px);
animation:float 12s ease-in-out infinite;
}

.orb-1{
width:500px;height:500px;
background:rgba(79,142,255,.12);
top:-150px;left:-150px;
}

.orb-2{
width:400px;height:400px;
background:rgba(0,229,192,.08);
bottom:-100px;right:-100px;
animation-delay:4s;
}

@keyframes float{
0%,100%{transform:translate(0,0)}
50%{transform:translate(30px,-30px)}
}

/* card */

.card{
width:100%;
max-width:560px;
background:var(--surface);
border:1px solid var(--border);
border-radius:var(--radius);
padding:2.5rem;
box-shadow:0 30px 80px rgba(0,0,0,.6);
}

/* header */

.logo{
display:flex;
gap:.7rem;
align-items:center;
margin-bottom:2rem;
}

.logo-icon{
width:40px;height:40px;
background:linear-gradient(135deg,var(--accent),var(--accent2));
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
}

.logo h1{
font-size:1.5rem;
font-weight:800;
}

.logo span{
font-family:'DM Mono',monospace;
font-size:.75rem;
color:var(--muted);
}

/* dropzone */

.dropzone{
border:2px dashed var(--border);
border-radius:12px;
padding:2.5rem 1rem;
text-align:center;
cursor:pointer;
margin-bottom:1rem;
position:relative;
transition:.25s;
}

.dropzone:hover,
.dropzone.dragover{
border-color:var(--accent);
background:rgba(79,142,255,.05);
}

.dropzone input{
position:absolute;
inset:0;
opacity:0;
cursor:pointer;
}

.dz-icon{font-size:2rem}
.dz-sub{
font-family:'DM Mono',monospace;
font-size:.8rem;
color:var(--muted);
margin-top:.3rem;
}

.file-chosen{
margin-top:.6rem;
font-family:'DM Mono',monospace;
font-size:.8rem;
color:var(--accent2);
display:none;
}

/* textarea */

textarea{
width:100%;
height:70px;
margin:1rem 0 1.4rem;
padding:.7rem 1rem;
border-radius:8px;
border:1px solid var(--border);
background:rgba(255,255,255,.03);
color:var(--text);
font-family:'DM Mono',monospace;
resize:none;
}

/* button */

.btn-upload{
width:100%;
background:linear-gradient(135deg,var(--accent),#2563eb);
color:#fff;
border:none;
border-radius:10px;
padding:.9rem;
font-weight:700;
cursor:pointer;
}

.btn-upload:disabled{
opacity:.4;
cursor:not-allowed;
}

/* progress */

.progress-wrap{
display:none;
margin-top:1rem;
}

.progress-bg{
background:var(--border);
height:4px;
border-radius:999px;
overflow:hidden;
}

.progress-fill{
height:100%;
width:0%;
background:linear-gradient(90deg,var(--accent),var(--accent2));
}

.progress-label{
font-family:'DM Mono',monospace;
font-size:.75rem;
color:var(--muted);
text-align:right;
margin-top:.3rem;
}

/* result */

#result{
display:none;
margin-top:2rem;
padding:1.5rem;
background:rgba(0,229,192,.04);
border:1px solid rgba(0,229,192,.2);
border-radius:var(--radius);
}

.link-box{
display:flex;
align-items:center;
gap:.5rem;
border:1px solid var(--border);
padding:.5rem .7rem;
border-radius:8px;
background:rgba(255,255,255,.03);
}

.link-box a{
flex:1;
font-family:'DM Mono',monospace;
font-size:.8rem;
color:var(--accent);
text-decoration:none;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
}

.copy-btn{
background:none;
border:none;
cursor:pointer;
color:var(--muted);
font-size:1rem;
}

/* footer */

footer{
margin-top:2rem;
font-family:'DM Mono',monospace;
font-size:.7rem;
color:var(--muted);
text-align:center;
}

</style>
</head>

<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="card">

<div class="logo">
<div class="logo-icon">⬡</div>
<div>
<h1>FileShare</h1>
<span>local network · instant links</span>
</div>
</div>

<div class="dropzone" id="dropzone">
<input type="file" id="fileInput">
<div class="dz-icon">📂</div>
<div>Drop your file here</div>
<div class="dz-sub">or click to browse · max 100 MB</div>
<div class="file-chosen" id="fileChosen"></div>
</div>

<textarea id="desc" placeholder="File description (optional)"></textarea>

<button class="btn-upload" id="uploadBtn" disabled>
⬆ Share File
</button>

<div class="progress-wrap" id="progressWrap">
<div class="progress-bg">
<div class="progress-fill" id="progressFill"></div>
</div>
<div class="progress-label" id="progressLabel">0%</div>
</div>

<div id="result">
<div class="link-box">
<a id="resLink" href="#" target="_blank"></a>
<button class="copy-btn" id="copyBtn">⎘</button>
</div>
<img id="qrImg" style="margin-top:10px;width:120px">
</div>

</div>

<footer>
FileShare runs on your local network. Links expire when the server stops.
</footer>

<script>

const fileInput=document.getElementById("fileInput")
const uploadBtn=document.getElementById("uploadBtn")
const chosen=document.getElementById("fileChosen")
const progressFill=document.getElementById("progressFill")
const progressLabel=document.getElementById("progressLabel")
const progressWrap=document.getElementById("progressWrap")

let file=null

fileInput.onchange=()=>{
file=fileInput.files[0]
if(!file)return
chosen.style.display="block"
chosen.textContent=`✓ ${file.name}`
uploadBtn.disabled=false
}

uploadBtn.onclick=()=>{

const fd=new FormData()
fd.append("file",file)

const xhr=new XMLHttpRequest()

progressWrap.style.display="block"

xhr.upload.onprogress=e=>{
const p=Math.round((e.loaded/e.total)*100)
progressFill.style.width=p+"%"
progressLabel.textContent=p+"%"
}

xhr.onload=()=>{
const d=JSON.parse(xhr.responseText)

document.getElementById("resLink").href=d.download_url
document.getElementById("resLink").textContent=d.download_url
document.getElementById("qrImg").src="data:image/png;base64,"+d.qr_b64

document.getElementById("result").style.display="block"
}

xhr.open("POST","/upload")
xhr.send(fd)

}

document.getElementById("copyBtn").onclick=()=>{
navigator.clipboard.writeText(
document.getElementById("resLink").href
)
}

</script>

</body>
</html>
